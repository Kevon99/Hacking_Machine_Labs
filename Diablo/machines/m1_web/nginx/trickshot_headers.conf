add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "cross-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header X-Download-Options "noopen" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header X-Edge-Region "eu-west-1" always;
add_header X-Edge-Cluster "trickshot-prod" always;
add_header X-Edge-Cache "shield-v3" always;
add_header X-TLS-Terminator "edge-mad1" always;
add_header X-Edge-Node "edge-01.trickshot.local" always;
add_header X-Nginx-Request-Id $request_id always;
add_header X-Upstream-Service "portal-web" always;
add_header X-Origin-TLS "TLSv1.3" always;
add_header Link "<http://trickshot.local/.well-known/security.txt>; rel=\"security\"" always;
